name: blowfit
description: BRELOW — expiratory resistance training companion app.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.0
  flutter_svg: ^2.0.10
  fl_chart: ^0.68.0
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  path: ^1.9.0
  path_provider: ^2.1.3
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  permission_handler: ^11.3.1
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  rive: ^0.14.0
  # 안드로이드 foreground service — 앱 종료 후에도 BLE 연결 유지 (auto-reconnect).
  flutter_foreground_task: ^8.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.13.1

# Figma 에서 export 한 app_icon.png (1024×1024) 로 안드로이드/iOS 아이콘 생성.
# dart run flutter_launcher_icons 실행 시 platform 별 적절한 사이즈로 자동 생성.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false  # 본 프로젝트는 Android only — iOS 디렉토리 없음
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/character/
    - assets/backgrounds/
    - assets/dot/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
