; BlowFit v4.0 — I²C bus scanner (standalone).
;
; 목적: MikroE Diff Press Click (MPXV7007DP + MCP3221) 의 실제 I²C 주소 확인.
; 본 펌웨어와 별개로 빌드 — TFT_eSPI / LVGL 의존성 없음 → 컴파일 빠름.
;
; 사용:
;   cd firmware-esp32/tools/i2c_scan
;   pio run -t upload
;   pio device monitor
;
; 기대 출력:
;   I2C device found at 0x4D   ← MCP3221 (예상)
;   (다른 주소가 나오면 본 펌웨어 include/config.h 의 MCP3221_ADDR 갱신)
;
; 배선:
;   GPIO43 (SDA) → Click SDA
;   GPIO44 (SCL) → Click SCL
;   3V3 → Click 3.3V
;   5V  → Click 5V
;   GND → Click GND

; ----- 공통 -----
[common]
platform = espressif32@^6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags_common =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=3

; ----- 기본 env: GPIO43 / GPIO44 -----
[env:i2c_scan]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags = ${common.build_flags_common}

; ----- 대체 env: GPIO17 / GPIO18 (디버그 — 43/44 충돌 의심 시) -----
[env:i2c_scan_alt]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags =
  ${common.build_flags_common}
  -DUSE_ALT_PINS
