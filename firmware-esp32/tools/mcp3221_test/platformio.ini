; BlowFit v4.0 — MCP3221 read test (standalone).
;
; 목적: i2c_scan 으로 검출된 MCP3221 (0x4D) 에서 실제 ADC 값을 읽고
; MPXV7007DP 차압 센서의 호흡 입력에 따라 값이 변하는지 검증.
;
; 사용:
;   cd firmware-esp32/tools/mcp3221_test
;   pio run -t upload
;   pio device monitor
;
; 기대 출력 (5Hz):
;   [12345] raw=2049 ratio=0.5003 kPa=+0.05 cmH2O=+0.5    ← 정지 (대기압)
;   [12545] raw=2310 ratio=0.5641 kPa=+1.13 cmH2O=+11.5   ← 호기 (양압)
;   [12745] raw=1820 ratio=0.4445 kPa=-0.97 cmH2O=-9.9    ← 흡기 (음압)
;
; 배선 (i2c_scan 과 동일):
;   GPIO43 (SDA) → Click SDA
;   GPIO44 (SCL) → Click SCL
;   3V3 → Click 3V3
;   3V3 → Click 5V (분기 또는 보드 위 short)
;   GND → Click GND

[env:mcp3221_test]
platform = espressif32@^6.9.0
board = lilygo-t-display-s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=3
