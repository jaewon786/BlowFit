; BlowFit v4.0 — LILYGO T-Display S3 펌웨어 PlatformIO 설정.
;
; 주요 결정:
;   - board: lilygo-t-display-s3 (PlatformIO espressif32 platform 내장)
;   - framework: arduino (BLE / TFT_eSPI / LVGL 가 Arduino API 의존)
;   - USB-CDC: 기본 활성 — Serial 출력이 USB 로 바로 나옴 (별도 USB-Serial 없음)
;   - 화면: 세로 (170×320) — main.cpp 에서 setRotation(0)
;   - TFT_eSPI: 외부 Setup206 헤더 직접 include (lib/TFT_eSPI_Setup/)
;   - LVGL: 외부 lv_conf.h 사용

[platformio]
default_envs = lilygo-t-display-s3

[env:lilygo-t-display-s3]
platform = espressif32@^6.9.0
board = lilygo-t-display-s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi

build_flags =
  ; ----- PSRAM (8MB OPI PSRAM) -----
  -DBOARD_HAS_PSRAM

  ; ----- USB-CDC 직접 활성 (Serial → USB) -----
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

  ; ----- TFT_eSPI: Setup206 직접 지정 -----
  ; (TFT_eSPI 의 User_Setup_Select.h 우회. lib/TFT_eSPI_Setup/ 의 헤더 사용.)
  -DUSER_SETUP_LOADED=1
  -include lib/TFT_eSPI_Setup/Setup206_LilyGo_T_Display_S3.h

  ; ----- LVGL: 외부 lv_conf.h 사용 (firmware-esp32/ 루트) -----
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_CONF_PATH=../../../lv_conf.h

  ; ----- include 검색 경로 -----
  -I include

  ; ----- 디버그 (release 시 0~1 로 낮춤) -----
  -DCORE_DEBUG_LEVEL=3

; LVGL build 안정성 — archive 비활성 (lv_conf.h 매크로 인식)
lib_archive = false

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^9.2.2

; ============================================================================
; Build environments
; ============================================================================
; - default (위): release 모드. 시리얼 디버그 minimal.
; - debug (필요시): -DCORE_DEBUG_LEVEL=5 + LVGL log verbose.
;
; 사용 예:
;   pio run                    # 빌드
;   pio run -t upload          # 빌드 + 업로드
;   pio device monitor         # 시리얼 모니터 (115200)
;   pio run -t clean           # 클린
